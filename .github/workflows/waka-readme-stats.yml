name: wakatime-stats

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commit (it pushes with a
    # personal GH_TOKEN, which would otherwise retrigger push indefinitely).
    if: ${{ !contains(github.event.head_commit.message, 'Updated with Dev Metrics') }}
    steps:
      - name: WakaTime stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        env:
          # These flags recreate the exact sections in the example README
          SHOW_LINES_OF_CODE: "True"          # "From Hello World I've Written..." badge
          SHOW_TOTAL_CODE_TIME: "True"        # "Code Time" badge
          SHOW_SHORT_INFO: "True"             # 🐱 My GitHub Data block
          SHOW_COMMIT: "True"                 # Morning/Daytime/Evening/Night breakdown
          SHOW_TIMEZONE: "True"               # 🕑 Time Zone line
          SHOW_LANGUAGE: "True"               # 💬 Programming Languages (this week)
          SHOW_PROJECTS: "True"               # 🐱‍💻 Projects (this week)
          SHOW_UPDATED_DATE: "True"           # "Last Updated on ..." footer
          # Sections the example does NOT show
          SHOW_PROFILE_VIEWS: "False"
          SHOW_EDITORS: "False"
          SHOW_OS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_DAYS_OF_WEEK: "False"
