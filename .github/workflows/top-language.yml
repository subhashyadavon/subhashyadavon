name: top-language

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with top 10 languages and code time (May 2026 - Present)
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commit to avoid retriggering
    # push-based runs indefinitely.
    if: ${{ !contains(github.event.head_commit.message, 'Update top languages') }}
    steps:
      - uses: actions/checkout@v7

      # Calls the WakaTime API directly instead of a third-party action --
      # avoids depending on someone else's floating Docker image/version.
      # WakaTime API keys are write-only (plugins) since 2026-11-01, so this
      # uses a personal OAuth token from https://wakatime.com/oauth instead.
      - name: Fetch top 10 languages from WakaTime and update README
        env:
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -s -H "Authorization: Bearer ${WAKATIME_ACCESS_TOKEN}" "https://wakatime.com/api/v1/users/current/stats/all_time")

          # Per-language brand color/logo (simple-icons slugs, as shields.io
          # uses) for the pie slices. Falls back to a neutral gray slice with
          # no logo for anything not in the table.
          declare -A COLOR=(
            [SCSS]="CC6699" [TypeScript]="3178C6" [HTML]="E34F26" [YAML]="CB171E"
            [Markdown]="000000" [JavaScript]="F7DF1E" [CSS]="1572B6" [Swift]="FA7343"
            [Python]="3776AB" [Java]="ED8B00" ["C#"]="512BD4" [C]="00599C" [SQL]="4479A1"
            [JSON]="000000" [Shell]="4EAA25" [Dockerfile]="2496ED" [Go]="00ADD8"
            [Rust]="000000" [PHP]="777BB4" [Ruby]="CC342D" [Vue]="4FC08D" ["C++"]="00599C"
          )
          declare -A LOGO=(
            [SCSS]="sass" [TypeScript]="typescript" [HTML]="html5" [YAML]="yaml"
            [Markdown]="markdown" [JavaScript]="javascript" [CSS]="css" [Swift]="swift"
            [Python]="python" [Java]="openjdk" ["C#"]="dotnet" [C]="c" [SQL]="postgresql"
            [JSON]="json" [Shell]="gnubash" [Dockerfile]="docker" [Go]="go" [Rust]="rust"
            [PHP]="php" [Ruby]="ruby" [Vue]="vuedotjs" ["C++"]="cplusplus"
          )

          # Excludes WakaTime's generic "Other"/"Text" catch-all buckets so
          # the list is 10 distinct real languages, not placeholder categories.
          rows=""
          while IFS=$'\t' read -r name percent; do
            color="${COLOR[$name]:-808080}"
            logo="${LOGO[$name]:-}"
            logocolor="white"
            [ "$name" = "JavaScript" ] && logocolor="black"
            rows="${rows}${name}"$'\t'"${percent}"$'\t'"${color}"$'\t'"${logo}"$'\t'"${logocolor}"$'\n'
          done < <(echo "$response" | jq -r '
            [(.data.languages // [])[] | select(.name != "Other" and .name != "Text")]
            | .[:10]
            | .[]
            | "\(.name)\t\(.percent)"
          ')

          # Pie chart in each language's brand colour and logo, as light and
          # dark SVGs that <picture> swaps to match the viewer's GitHub theme.
          # The alt text carries the numbers for screen readers.
          alt=$(printf '%s' "$rows" | awk -F'\t' '{ printf "%s%s %s%%", (NR > 1 ? ", " : ""), $1, $2 }')
          pie="<picture>
            <source media=\"(prefers-color-scheme: dark)\" srcset=\"assets/languages-dark.svg\">
            <img alt=\"Top languages by coding time: ${alt}\" src=\"assets/languages-light.svg\">
          </picture>"

          # Replaces everything between <!--START_SECTION:$1--> and
          # <!--END_SECTION:$1--> in README.md with $2. Passed via ENVIRON
          # rather than -v so multi-line content and backslashes survive.
          replace_section() {
            content="$2" awk -v name="$1" '
              $0 ~ "<!--START_SECTION:" name "-->" { print; printf "%s\n", ENVIRON["content"]; skip=1; next }
              $0 ~ "<!--END_SECTION:" name "-->" { skip=0 }
              !skip { print }
            ' README.md > README.md.tmp && mv README.md.tmp README.md
          }

          # WakaTime occasionally returns no language data (e.g. an error or
          # while it's recalculating stats); keep the last good chart rather
          # than blanking the section.
          if [ -n "$rows" ]; then
            printf '%s' "$rows" | python3 .github/scripts/language_pie.py
            replace_section top-lang "$pie"
          else
            echo "::warning::WakaTime returned no languages; leaving README section unchanged. Response: $(echo "$response" | head -c 300)"
          fi

          # Total coding time, including the "Other" bucket excluded above.
          # Left untouched if WakaTime hasn't computed the stats yet.
          total=$(echo "$response" | jq -r '.data.human_readable_total_including_other_language // empty')
          if [ -n "$total" ]; then
            enc=$(echo "$total" | sed -e 's/-/--/g' -e 's/ /_/g')
            replace_section code-time "![Code Time](https://img.shields.io/badge/Code_Time-${enc}-2EA44F?style=flat-square&logo=wakatime&logoColor=white)"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if ! git diff --cached --quiet; then
            git commit -m "Update top languages"
            git push
          fi
