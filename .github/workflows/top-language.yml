name: top-language

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with top 5 all-time languages
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own commit to avoid retriggering
    # push-based runs indefinitely.
    if: ${{ !contains(github.event.head_commit.message, 'Update top languages') }}
    steps:
      - uses: actions/checkout@v7

      # Calls the WakaTime API directly instead of a third-party action --
      # avoids depending on someone else's floating Docker image/version.
      - name: Fetch top 5 languages from WakaTime and update README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -s "https://wakatime.com/api/v1/users/current/stats/all_time?api_key=${WAKATIME_API_KEY}")

          # Per-language brand color/logo so each badge looks visually
          # distinct, matching shields.io conventions. Falls back to a
          # neutral gray, unlabeled badge for anything not in the table.
          declare -A COLOR=(
            [SCSS]="CC6699" [TypeScript]="3178C6" [HTML]="E34F26" [YAML]="CB171E"
            [Markdown]="000000" [JavaScript]="F7DF1E" [CSS]="1572B6" [Swift]="FA7343"
            [Python]="3776AB" [Java]="ED8B00" ["C#"]="512BD4" [C]="00599C" [SQL]="4479A1"
            [JSON]="000000" [Shell]="4EAA25" [Dockerfile]="2496ED" [Go]="00ADD8"
            [Rust]="000000" [PHP]="777BB4" [Ruby]="CC342D" [Vue]="4FC08D" ["C++"]="00599C"
          )
          declare -A LOGO=(
            [SCSS]="sass" [TypeScript]="typescript" [HTML]="html5" [YAML]="yaml"
            [Markdown]="markdown" [JavaScript]="javascript" [CSS]="css3" [Swift]="swift"
            [Python]="python" [Java]="openjdk" ["C#"]="dotnet" [C]="c" [SQL]="postgresql"
            [JSON]="json" [Shell]="gnubash" [Dockerfile]="docker" [Go]="go" [Rust]="rust"
            [PHP]="php" [Ruby]="ruby" [Vue]="vuedotjs" ["C++"]="cplusplus"
          )

          # Excludes WakaTime's generic "Other"/"Text" catch-all buckets so
          # the list is 5 distinct real languages, not placeholder categories.
          list=""
          while IFS=$'\t' read -r name percent; do
            color="${COLOR[$name]:-808080}"
            logo="${LOGO[$name]:-}"
            logocolor="white"
            [ "$name" = "JavaScript" ] && logocolor="black"
            # shields.io escaping: literal "-" -> "--", "#"/"+"/" " URL-encoded.
            enc=$(echo "$name" | sed -e 's/-/--/g' -e 's/#/%23/g' -e 's/+/%2B/g' -e 's/ /_/g')
            label="${enc}-${percent}%25-${color}"
            if [ -n "$logo" ]; then
              badge="https://img.shields.io/badge/${label}?style=flat-square&logo=${logo}&logoColor=${logocolor}"
            else
              badge="https://img.shields.io/badge/${label}?style=flat-square"
            fi
            list="${list}![${name}](${badge}) "
          done < <(echo "$response" | jq -r '
            [.data.languages[] | select(.name != "Other" and .name != "Text")]
            | .[:5]
            | .[]
            | "\(.name)\t\(.percent)"
          ')

          awk -v list="$list" '
            /<!--START_SECTION:top-lang-->/ { print; printf "%s", list; skip=1; next }
            /<!--END_SECTION:top-lang-->/ { skip=0 }
            !skip { print }
          ' README.md > README.md.tmp && mv README.md.tmp README.md

      - name: Commit and push if changed
        run: |
          git config user.name "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Update top languages"
            git push
          fi
